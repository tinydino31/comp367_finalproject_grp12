trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

stages:

# =========================
# BUILD + SONARCLOUD
# =========================
- stage: Build
  jobs:
  - job: BuildAndAnalyze
    steps:

    # REQUIRED: full git history for Sonar SCM analysis
    - checkout: self
      fetchDepth: 0

    # =========================
    # SONARCLOUD PREPARE
    # =========================
    - task: SonarCloudPrepare@4
      displayName: 'Prepare SonarCloud Analysis'
      inputs:
        SonarCloud: 'sonarqubecloud'
        organization: 'tinydino31'
        scannerMode: 'Maven'
        projectKey: 'com.kaur.lab2:Week2_Lab2_301435549_JashanjotKaur'
        projectName: 'Week2_Lab2_301435549_JashanjotKaur'
        extraProperties: |
          sonar.qualitygate.wait=true

    # =========================
    # BUILD + TEST (NO sonar:sonar)
    # =========================
    - task: Maven@3
      displayName: 'Build and Test'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean verify'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        codeCoverageToolOption: 'JaCoCo'

    # =========================
    # SONARCLOUD ANALYSIS
    # =========================
    - task: SonarCloudAnalyze@4
      displayName: 'Run SonarCloud Analysis'

    # =========================
    # QUALITY GATE CHECK
    # =========================
    - task: SonarCloudPublish@4
      displayName: 'Publish Quality Gate Result'
      inputs:
        pollingTimeoutSec: '300'

    # =========================
    # TEST RESULTS
    # =========================
    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/surefire-reports/TEST-*.xml'

    # =========================
    # CODE COVERAGE
    # =========================
    - task: PublishCodeCoverageResults@2
      displayName: 'Publish Code Coverage'
      inputs:
        summaryFileLocation: 'target/site/jacoco/jacoco.xml'
        pathToSources: 'src/main/java'


# =========================
# PACKAGE STAGE
# =========================
- stage: Deliver
  dependsOn: Build
  jobs:
  - job: PackageJob
    steps:
    - task: Maven@3
      displayName: 'Package Application'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'package'


# =========================
# DEPLOY STAGES (MOCK)
# =========================

- stage: DeployDev
  dependsOn: Deliver
  jobs:
  - job: DevJob
    steps:
    - script: echo "Deploying to Dev Environment"
      displayName: 'Deploy Dev'

- stage: DeployQAT
  dependsOn: DeployDev
  jobs:
  - job: QATJob
    steps:
    - script: echo "Deploying to QAT Environment"
      displayName: 'Deploy QAT'

- stage: DeployStaging
  dependsOn: DeployQAT
  jobs:
  - job: StagingJob
    steps:
    - script: echo "Deploying to Staging Environment"
      displayName: 'Deploy Staging'

- stage: DeployProduction
  dependsOn: DeployStaging
  jobs:
  - job: ProdJob
    steps:
    - script: echo "Deploying to Production Environment"
      displayName: 'Deploy Production'
