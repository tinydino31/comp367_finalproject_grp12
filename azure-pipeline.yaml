trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

stages:

# =========================
# BUILD + SONARCLOUD
# =========================
- stage: Build
  jobs:
  - job: BuildAndAnalyze
    steps:

    # Full repo history (required for Sonar)
    - checkout: self
      fetchDepth: 0

    # =========================
    # SONARCLOUD PREPARE
    # =========================
    - task: SonarCloudPrepare@4
      displayName: 'Prepare SonarCloud Analysis'
      inputs:
        SonarCloud: 'sonarqubecloud'   # MUST match your service connection name
        organization: 'tinydino31'
        scannerMode: 'Other'
        projectKey: 'tinydino31_comp367_finalproject_grp12'
        projectName: 'comp367_finalproject_grp12'
        extraProperties: |
          sonar.host.url=https://sonarcloud.io
          sonar.organization=tinydino31
          sonar.projectKey=tinydino31_comp367_finalproject_grp12
          sonar.qualitygate.wait=true

    # =========================
    # BUILD + TEST + SONAR
    # =========================
    - task: Maven@3
      displayName: 'Build, Test and Analyze'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean verify sonar:sonar'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        codeCoverageToolOption: 'JaCoCo'

    # =========================
    # QUALITY GATE
    # =========================
    - task: SonarCloudPublish@4
      displayName: 'Publish Quality Gate Result'
      inputs:
        pollingTimeoutSec: '300'

    # =========================
    # TEST RESULTS
    # =========================
    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/surefire-reports/TEST-*.xml'

    # =========================
    # CODE COVERAGE
    # =========================
    - task: PublishCodeCoverageResults@2
      displayName: 'Publish Code Coverage'
      inputs:
        summaryFileLocation: 'target/site/jacoco/jacoco.xml'
        pathToSources: 'src/main/java'


# =========================
# PACKAGE STAGE
# =========================
- stage: Deliver
  dependsOn: Build
  jobs:
  - job: PackageJob
    steps:
    - task: Maven@3
      displayName: 'Package Application'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'package'


# =========================
# DEPLOY STAGES (MOCK)
# =========================

- stage: DeployDev
  dependsOn: Deliver
  jobs:
  - job: DevJob
    steps:
    - script: echo "Deploying to Dev Environment"
      displayName: 'Deploy Dev'

- stage: DeployQAT
  dependsOn: DeployDev
  jobs:
  - job: QATJob
    steps:
    - script: echo "Deploying to QAT Environment"
      displayName: 'Deploy QAT'

- stage: DeployStaging
  dependsOn: DeployQAT
  jobs:
  - job: StagingJob
    steps:
    - script: echo "Deploying to Staging Environment"
      displayName: 'Deploy Staging'

- stage: DeployProduction
  dependsOn: DeployStaging
  jobs:
  - job: ProdJob
    steps:
    - script: echo "Deploying to Production Environment"
      displayName: 'Deploy Production'
