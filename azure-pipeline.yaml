trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

stages:

# =========================
# BUILD STAGE
# =========================
- stage: Build
  jobs:
  - job: BuildJob
    steps:

    # STEP 1 - SonarQube Prepare
    - task: SonarCloudPrepare@4
      displayName: 'Prepare SonarQube Analysis'
      inputs:
        SonarCloud: 'sonarqubecloud'        
        organization: 'tinydino31'       
        scannerMode: 'Other'
            extraProperties: |
      sonar.branch.name=main

    # STEP 2 - Compile Project
    - task: Maven@3
      displayName: 'Step 1 - Compile Project'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'compile'
        publishJUnitResults: false

    # STEP 3 - Run Tests and Code Coverage
    - task: Maven@3
      displayName: 'Step 2 - Run Tests and Code Coverage'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean verify sonar:sonar'  
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        codeCoverageToolOption: 'JaCoCo'
        sonarQubeRunAnalysis: true        

    # STEP 4 - Publish SonarQube Results
    - task: SonarCloudPublish@4
      displayName: 'Publish SonarQube Results'
      inputs:
        pollingTimeoutSec: '300'

    # STEP 5 - Publish Test Results
    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/target/surefire-reports/*.xml'

    # STEP 6 - Publish Code Coverage
    - task: PublishCodeCoverageResults@2
      displayName: 'Publish Code Coverage'
      inputs:
        summaryFileLocation: 'target/site/jacoco/jacoco.xml'
        pathToSources: 'src/main/java'

# =========================
# DELIVER STAGE
# =========================
- stage: Deliver
  jobs:
  - job: DeliverJob
    steps:
    - task: Maven@3
      displayName: 'Package Artifact'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'package'

# =========================
# DEPLOY STAGES (mocked - rubric allows this)
# =========================
- stage: DeployDev
  jobs:
  - job: DeployDevJob
    steps:
    - script: echo "Deploying to Dev Environment"
      displayName: 'Deploy to Dev'

- stage: DeployQAT
  jobs:
  - job: DeployQATJob
    steps:
    - script: echo "Deploying to QAT Environment"
      displayName: 'Deploy to QAT'

- stage: DeployStaging
  jobs:
  - job: DeployStagingJob
    steps:
    - script: echo "Deploying to Staging Environment"
      displayName: 'Deploy to Staging'

- stage: DeployProduction
  jobs:
  - job: DeployProductionJob
    steps:
    - script: echo "Deploying to Production Environment"
      displayName: 'Deploy to Production'
