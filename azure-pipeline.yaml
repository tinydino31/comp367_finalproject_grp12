trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

stages:

# =========================
# BUILD + SONAR STAGE
# =========================
- stage: Build
  jobs:
  - job: BuildAndAnalyze
    steps:

    # IMPORTANT: Full git history for Sonar SCM analysis
    - checkout: self
      fetchDepth: 0

    # =========================
    # 1. SONARCLOUD PREPARE
    # =========================
    - task: SonarCloudPrepare@4
      displayName: 'Prepare SonarCloud Analysis'
      inputs:
        SonarCloud: 'sonarqubecloud'
        organization: 'tinydino31'
        scannerMode: 'Maven'
        projectKey: 'com.kaur.lab2:Week2_Lab2_301435549_JashanjotKaur'
        projectName: 'Week2 Lab2 Kaur Project'
        extraProperties: |
          sonar.qualitygate.wait=true

    # =========================
    # 2. BUILD + TEST (NO sonar:sonar here)
    # =========================
    - task: Maven@3
      displayName: 'Build & Test'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean verify'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        codeCoverageToolOption: 'JaCoCo'

    # =========================
    # 3. RUN SONAR ANALYSIS (AZURE CONTROLLED)
    # =========================
    - task: SonarCloudAnalyze@4
      displayName: 'Run SonarCloud Analysis'

    # =========================
    # 4. QUALITY GATE CHECK
    # =========================
    - task: SonarCloudPublish@4
      displayName: 'Publish SonarCloud Quality Gate'
      inputs:
        pollingTimeoutSec: '300'

    # =========================
    # 5. TEST RESULTS
    # =========================
    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/surefire-reports/TEST-*.xml'

    # =========================
    # 6. CODE COVERAGE
    # =========================
    - task: PublishCodeCoverageResults@2
      displayName: 'Publish Code Coverage'
      inputs:
        summaryFileLocation: 'target/site/jacoco/jacoco.xml'
        pathToSources: 'src/main/java'


# =========================
# DELIVER STAGE
# =========================
- stage: Deliver
  dependsOn: Build
  jobs:
  - job: Package
    steps:
    - task: Maven@3
      displayName: 'Package Application'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'package'


# =========================
# DEPLOY STAGES (MOCK)
# =========================

- stage: DeployDev
  dependsOn: Deliver
  jobs:
  - job: DevDeploy
    steps:
    - script: echo "Deploying to Dev"
      displayName: 'Deploy Dev'

- stage: DeployQAT
  dependsOn: DeployDev
  jobs:
  - job: QATDeploy
    steps:
    - script: echo "Deploying to QAT"
      displayName: 'Deploy QAT'

- stage: DeployStaging
  dependsOn: DeployQAT
  jobs:
  - job: StagingDeploy
    steps:
    - script: echo "Deploying to Staging"
      displayName: 'Deploy Staging'

- stage: DeployProduction
  dependsOn: DeployStaging
  jobs:
  - job: ProdDeploy
    steps:
    - script: echo "Deploying to Production"
      displayName: 'Deploy Production'
