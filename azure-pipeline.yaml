trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

stages:

# =========================
# BUILD STAGE
# =========================
- stage: Build
  jobs:
  - job: BuildJob
    steps:

    # IMPORTANT: Fix shallow clone (prevents Sonar SCM warnings)
    - checkout: self
      fetchDepth: 0

    # STEP 1 - SonarCloud Prepare
    - task: SonarCloudPrepare@4
      displayName: 'Prepare SonarCloud Analysis'
      inputs:
        SonarCloud: 'sonarqubecloud'
        organization: 'tinydino31'
        scannerMode: 'Other'
        extraProperties: |
          sonar.qualitygate.wait=true

    # STEP 2 - Compile Project
    - task: Maven@3
      displayName: 'Compile Project'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'compile'
        publishJUnitResults: false

    # STEP 3 - Test + Sonar Analysis
    - task: Maven@3
      displayName: 'Run Tests + Sonar Analysis'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean verify sonar:sonar'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        codeCoverageToolOption: 'JaCoCo'

    # STEP 4 - Publish Sonar Results (Quality Gate)
    - task: SonarCloudPublish@4
      displayName: 'Publish SonarCloud Quality Gate'
      inputs:
        pollingTimeoutSec: '300'

    # STEP 5 - Publish Test Results
    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/target/surefire-reports/*.xml'

    # STEP 6 - Publish Code Coverage
    - task: PublishCodeCoverageResults@2
      displayName: 'Publish Code Coverage'
      inputs:
        summaryFileLocation: 'target/site/jacoco/jacoco.xml'
        pathToSources: 'src/main/java'

# =========================
# DELIVER STAGE
# =========================
- stage: Deliver
  dependsOn: Build
  jobs:
  - job: DeliverJob
    steps:
    - task: Maven@3
      displayName: 'Package Artifact'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'package'

# =========================
# DEPLOY STAGES (Mocked)
# =========================

- stage: DeployDev
  dependsOn: Deliver
  jobs:
  - job: DeployDevJob
    steps:
    - script: echo "Deploying to Dev Environment"
      displayName: 'Deploy to Dev'

- stage: DeployQAT
  dependsOn: DeployDev
  jobs:
  - job: DeployQATJob
    steps:
    - script: echo "Deploying to QAT Environment"
      displayName: 'Deploy to QAT'

- stage: DeployStaging
  dependsOn: DeployQAT
  jobs:
  - job: DeployStagingJob
    steps:
    - script: echo "Deploying to Staging Environment"
      displayName: 'Deploy to Staging'

- stage: DeployProduction
  dependsOn: DeployStaging
  jobs:
  - job: DeployProductionJob
    steps:
    - script: echo "Deploying to Production Environment"
      displayName: 'Deploy to Production'
